[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-calliope"
version = "0.1.0"
description = "Hera's Garden narrative archivist for Tupperbox roleplay"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1",
    "cryptography>=43,<46",
    "discord.py>=2.5,<3",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["calliope*"]
